

services:
  postgres-identity:
    image: postgres:15-alpine
    container_name: o2o_db_identity
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: identity_db
    ports:
      - "5435:5432"
    volumes:
      - identity_data:/var/lib/postgresql/data

  postgres-booking:
    image: postgres:15-alpine
    container_name: o2o_db_booking
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: booking_db
    ports:
      - "5433:5432" # Chạy ở port 5433 của máy tính
    volumes:
      - booking_data:/var/lib/postgresql/data

  postgres-commerce:
    image: postgres:15-alpine
    container_name: o2o_db_commerce
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: commerce_db
    ports:
      - "5434:5432" # Chạy ở port 5434 của máy tính
    volumes:
      - commerce_data:/var/lib/postgresql/data
      
  mongodb-ai:
    image: mongo:6.0
    container_name: o2o_db_medical
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  pgadmin:
    image: dpage/pgadmin4
    container_name: o2o_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  
  postgres-media:
    image: postgres:15-alpine
    container_name: o2o_db_media
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: media_db
    ports:
      - "5436:5432"
    volumes:
      - media_data:/var/lib/postgresql/data

# Volume có tên cố định cho từng DB: xóa / tạo lại container (docker compose down, Delete trong Docker Desktop)
# vẫn gắn lại đúng dữ liệu cũ. Chỉ "docker compose down -v" hoặc xóa volume mới làm mất dữ liệu.
volumes:
  identity_data:
    name: o2o_identity_data
  booking_data:
    name: o2o_booking_data
  commerce_data:
    name: o2o_commerce_data
  media_data:
    name: o2o_media_data
  mongo_data:
    name: o2o_mongo_data
  pgadmin_data:
    name: o2o_pgadmin_data
